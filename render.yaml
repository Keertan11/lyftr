services:
  - type: web
    name: lyftr-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: true
      - key: LLM_MODEL
        value: gemini/gemini-3-flash-preview
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: 30
    healthCheckPath: /health
